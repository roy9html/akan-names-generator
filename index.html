<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Akan Name Generator</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <h1>Akan Name Generator</h1>
    <p>Enter your birth date and gender to discover your Akan name based on the day of the week you were born.</p>

    <section class="form-section">
        <form id="akanForm">
            <label for="day">Day (1-31):</label>
            <input type="number" id="day" min="1" max="31" required>

            <label for="month">Month (1-12):</label>
            <input type="number" id="month" min="1" max="12" required>

            <label for="year">Year:</label>
            <input type="number" id="year" min="1900" max="2100" required>

            <label>Gender:</label>
            <div class="gender-options">
                <label><input type="radio" name="gender" value="male" required> Male</label>
                <label><input type="radio" name="gender" value="female" required> Female</label>
            </div>

            <button type="submit">Get Akan Name</button>
        </form>

        <div id="result"></div>
    </section>
</body>
</html>
